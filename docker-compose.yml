version: '3.8'

services:
  soc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-nids-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOC_USERNAME=admin
      - SOC_PASSWORD=super_secure_admin_password_123
